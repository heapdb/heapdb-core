[package]
name = "heapdb-postgres"
description = "HeapDB keyed heaps stored in PostgreSQL (persist_to = \"postgres://...\"): the SQL engine and a Rust HeapBackend."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.85"
repository.workspace = true
readme = "../../README.md"
keywords = ["database", "postgres", "priority-queue", "heap", "work-queue"]
categories = ["database"]

[dependencies]
heapdb.workspace = true
serde_json.workspace = true
postgres = { version = "0.19.14", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"

[dev-dependencies]
proptest.workspace = true
