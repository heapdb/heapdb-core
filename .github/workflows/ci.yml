name: ci

# Rust: fmt, clippy (-D warnings, all features incl. the server's
# cluster-aws), cargo test (engine, CLI, heapdb-server incl. its single-node,
# crash-recovery, parity and in-memory cluster tests). Server emulator:
# cluster tests against moto (S3 + DynamoDB). Python: build the extension
# with maturin and run the full pytest suite on several Python versions
# (on Linux also against a heapdb-server binary for heapdb.connect()).
# Wheels: built for Linux / macOS / Windows (abi3, Python >= 3.10) on tags.

on:
  push:
    branches: [main, rust]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5  # PyO3 needs an interpreter to build the bindings crate
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  server-emulator:
    # The cluster scenarios against an AWS emulator through the real SDK
    # backends (they also run on in-memory fakes in the rust job).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Start moto (S3 + DynamoDB emulator)
        run: |
          python -m pip install "moto[server,s3,dynamodb]"
          moto_server -p 5000 > moto.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:5000/ >/dev/null && break; sleep 0.2; done
      - name: cluster tests (emulator)
        env:
          HEAPDB_TEST_AWS_ENDPOINT: http://127.0.0.1:5000
        run: cargo test -p heapdb-server --features cluster-aws --test cluster

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: Swatinem/rust-cache@v2
      - name: Build wheel (maturin)
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist
      - name: Build heapdb-server (remote client tests)
        if: runner.os == 'Linux'
        run: cargo build -p heapdb-server
      - name: Install wheel + test deps
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest openapi-spec-validator -r benchmarks/requirements.txt
      - name: pytest
        shell: bash
        run: pytest -q -rs --junitxml=junit.xml
      - name: Report failing tests as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("junit.xml").getroot()
          except Exception as e:
              print(f"::error title=pytest::no junit.xml ({e})"); raise SystemExit
          for case in root.iter("testcase"):
              for bad in list(case.iter("failure")) + list(case.iter("error")):
                  name = f"{case.get('classname')}::{case.get('name')}"
                  text = ((bad.get("message") or "") + "\n" + (bad.text or "")).strip()
                  text = text[-1500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={name}::{text}")
          EOF

  wheels:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-14, target: x86_64 }   # cross-compiled on Apple silicon
          - { os: macos-14, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # Publishes wheels + sdist to PyPI with trusted publishing (OIDC, no API token).
  # One-time PyPI setup: a (pending) trusted publisher for project "heapdb" with
  # owner heapdb, repository heapdb-core, workflow ci.yml, environment pypi.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/heapdb/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          [ "$want" = "$have" ] || { echo "::error::tag v$want but pyproject.toml has $have"; exit 1; }
      - uses: actions/download-artifact@v4
        with:   # this run's only artifacts are the wheels-* and sdist uploads above
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
