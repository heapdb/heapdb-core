name: server-image

# Multi-arch (amd64 + arm64) container image of heapdb-server, pushed to
# ghcr.io/heapdb/heapdb-server: `edge` from main, `<version>` and `latest`
# from tags `server-v<version>`.

on:
  push:
    branches: [main]
    tags: ["server-v*"]
  pull_request:
    paths:
      - "crates/heapdb-server/**"
      - "crates/heapdb/**"
      - "Cargo.lock"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/heapdb/heapdb-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=server-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/server-v') }}
          labels: |
            org.opencontainers.image.title=heapdb-server
            org.opencontainers.image.description=HeapDB data plane (Data API + Admin API)
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build (and push outside pull requests)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/heapdb-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
