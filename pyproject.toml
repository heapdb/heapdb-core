[build-system]
# Building from source needs a Rust toolchain (rustc/cargo >= 1.82, e.g. via
# https://rustup.rs); maturin drives the build. Pre-built wheels need nothing.
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "heapdb"
version = "0.6.0"
description = "HeapDB: pop the most likely cause, right now. Ranked, explainable attribution over an append-only event stream (Rust engine, Python bindings)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []
keywords = ["database", "attribution", "root-cause-analysis", "top-k", "event-stream", "causal"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Database",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
heapdb = "heapdb.cli:main"

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "bindings/python/python"
module-name = "heapdb._core"
# The release wheels include the Postgres backend (Heaps(persist_to="postgres://...")).
features = ["postgres"]
include = [{ path = "LICENSE", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
